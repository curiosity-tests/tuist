name: App

on:
  push:
    branches:
    - main
    paths:
    - "app/**"
    - ".github/workflows/app.yml"
    - "Tuist/**"
    - ".xcode-version"
    - ".swiftpm/**"
    - "Package.swift"
    - "Package.resolved"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
    - "app/**"
    - ".github/workflows/app.yml"
    - "Tuist/**"
    - ".xcode-version"
    - ".swiftpm/**"
    - "Package.swift"
    - "Package.resolved"
  workflow_dispatch:

permissions:
  contents: read

env:
  MISE_VERSION: "2026.5.15"
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  MISE_GITHUB_TOKEN: ${{ secrets.TUIST_APP_GITHUB_TOKEN || github.token }}
  TUIST_ENABLE_CACHING: ${{ github.event.pull_request.head.repo.fork != true }}
  MISE_GITHUB_ATTESTATIONS: 0
  # Skip mise's SLSA provenance verification for github-backend tools only.
  # The verification resolves the release through
  # api.github.com/repos/<owner>/<repo>/releases/tags/<tag>, which mise.lock
  # cannot replace: the lockfile only supplies the download URL, and mise
  # already prefers that CDN URL over url_api. So this API call is the last
  # one standing on the install path, and it 403s once the token's hourly
  # budget is spent across concurrent runs - failing the install of
  # `github:endevco/aube` and `github:pomerium/cli`. The jobs here install the
  # full merged root toolset (the Xcode build phases and scheme post-actions
  # need it, so the install cannot be scoped), so they always pull both.
  # Aqua-backend SLSA stays ON: mise.lock records slsa provenance for aqua
  # tools (e.g. getsops/sops) and this setting does not touch them. Same
  # setting as server.yml, server-deployment.yml and
  # server-production-deployment.yml.
  MISE_GITHUB_SLSA: 0

concurrency:
  group: app-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  check-team-membership:
    name: Check Team Membership
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    outputs:
      is-team-member: ${{ steps.check.outputs.is-member }}
    steps:
    - name: Check if author is team member
      id: check
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.TUIST_APP_GITHUB_TOKEN || github.token }}
        script: |
          // If TUIST_GITHUB_TOKEN is not available (e.g., from a fork), treat as non-member
          const token = '${{ secrets.TUIST_APP_GITHUB_TOKEN }}';
          if (!token || token === '') {
            console.log(`Running from fork - treating ${context.payload.pull_request.user.login} as non-member`);
            core.setOutput('is-member', 'false');
            return;
          }

          try {
            const { data: membership } = await github.rest.teams.getMembershipForUserInOrg({
              org: 'tuist',
              team_slug: 'engineering',
              username: context.payload.pull_request.user.login
            });
            console.log(`User ${context.payload.pull_request.user.login} is a member of @tuist/engineering`);
            core.setOutput('is-member', 'true');
          } catch (error) {
            if (error.status === 404) {
              console.log(`User ${context.payload.pull_request.user.login} is NOT a member of @tuist/engineering`);
            } else {
              // Don't let a transient GitHub API error (e.g. 403 rate-limit) fail the
              // whole workflow. Fail safe: treat the author as a non-member so the
              // privileged device-build/share steps skip rather than the PR going red.
              console.log(`Could not resolve team membership (${error.status} ${error.message}); treating as non-member`);
            }
            core.setOutput('is-member', 'false');
          }
